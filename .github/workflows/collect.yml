name: Collect verified Fregion market snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/collector.py'
      - '.github/workflows/collect.yml'

permissions:
  contents: write

concurrency:
  group: fregion-market-collector
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'nineninezerotwo/aion2-craft-pulse'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test snapshot validation and ROI engine
        run: |
          python -m unittest discover -s tests -v
          node tests/test_engine.js
          node --check docs/app.js
          node --check docs/engine.js
      - name: Read only the verified Fregion public market summaries
        env:
          MARKET_SERVER_ID: '11507'
          CONFIRM_FREGION_SERVER_ID: '11507'
        run: python scripts/collector.py
      - name: Commit validated snapshots to GitHub
        run: |
          git config user.name 'fregion-market-bot'
          git config user.email 'fregion-market-bot@users.noreply.github.com'
          git add docs/data/latest.json docs/data/history.json
          if git diff --cached --quiet; then
            echo 'No data changes'
            exit 0
          fi
          git commit -m 'data: update Asia Elyos Fregion market reference snapshot'
          git push
