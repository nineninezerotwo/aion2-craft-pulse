name: Validate Fregion Craft Pulse

# GitHub Pages is already published from main/docs by the native Pages workflow.
# Do not publish Pages a second time here: dual deployments were racing and
# causing intermittent HTTP 400 "in progress deployment" failures.
# Scheduled market collector still publishes its own hourly data snapshot,
# because GitHub Actions GITHUB_TOKEN pushes do not trigger ordinary push workflows.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/**'
      - 'scripts/import_client_recipes.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fregion-code-validate
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dataset and calculations
        run: |
          python -m unittest discover -s tests -v
          node tests/test_engine.js
          node tests/test_catalog_integration.js
          node --check docs/app.js
          node --check docs/engine.js
